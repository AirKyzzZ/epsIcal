name: scrape

# Hyperplanning is a plain authenticated iCal URL, so the fetch no longer needs
# a browser or a residential IP the way the old Wigor scraper did — Actions can
# own the scheduled run again.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Configure git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper store
          umask 077
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials"

      - name: Fetch and publish
        env:
          HP_ICAL_URL: ${{ secrets.HP_ICAL_URL }}
        run: npx tsx src/index.ts scrape

      # GitHub disables schedules after 60 days without repo activity; this resets the clock.
      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable"
